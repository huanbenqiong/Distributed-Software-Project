spring:
  application:
    name: seckill-system
  datasource:
    url: jdbc:h2:mem:seckill;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 64
        max-idle: 16
        min-idle: 4

server:
  port: 8080

# 未启动 Redis 时设为 false，将使用内存原子扣减（仅本地演示）
seckill:
  redis:
    enabled: ${SECKILL_REDIS:true}

logging:
  level:
    com.sherlock.seckill: INFO
